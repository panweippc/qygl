# =====================================================
# 公共安全响应头（供 server 及各 location 复用）
# 注意：Nginx 中一旦某 location 出现 add_header，会覆盖 server 级全部 add_header，
#       因此本文件需在 server 级和所有用到 add_header 的 location 级都 include。
# =====================================================
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header X-Permitted-Cross-Domain-Policies "none" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# CSP：允许同源脚本/样式/图片，放行 blob/data 与 jsdelivr 地图数据源
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self' ws: wss: https://cdn.jsdelivr.net; frame-ancestors 'self'; object-src 'none'; base-uri 'self'; form-action 'self'" always;
