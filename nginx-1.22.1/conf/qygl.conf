# =====================================================
# 智慧办公平台 Nginx 站点配置
# 用途：托管前端静态文件 + 反向代理后端 API + WebSocket
# 部署位置：E:\AI\qy\nginx-1.22.1\conf\qygl.conf
# 由主 nginx.conf 通过 include 引入
# 监听端口：8080（80 端口被 Apache httpd 占用故避开）
# 访问方式：http://服务器IP:8080
# =====================================================

server {
    # 说明：明文 HTTP/2 (h2c) 与部分客户端（.NET HttpClient、部分 curl）存在协议冲突，
    # 为保证内网各类客户端稳定访问，采用 HTTP/1.1。启用 HTTPS 后可开启 HTTP/2。
    listen       8080;
    server_name  _;   # 监听所有主机名（内网IP直接访问）

    charset utf-8;

    # ============================================
    # IP 访问白名单（内网网段限制）
    # 允许：192.168.1.0/24、192.168.2.0/24 网段 + 本机回环
    # 其余 IP 一律拒绝（403），防止外网/非授权网络访问
    # 注意：如需允许更多网段，在此追加 allow 行即可
    # ============================================
    allow 127.0.0.1;
    allow 192.168.0.0/16;   # 覆盖 192.168.x.x 全段，避免 DHCP 自动 IP 变化后无法访问
    allow 192.168.1.0/24;
    allow 192.168.2.0/24;
    deny all;

    # ---- 日志（json 格式便于分析，含请求/上游耗时）----
    access_log  logs/qygl-access.log json;
    error_log   logs/qygl-error.log;

    # ---- 请求体大小限制（与后端一致，10MB）----
    client_max_body_size 20m;

    # ---- 请求头/超时限制（防慢速连接攻击 Slowloris、超大请求头 DoS）----
    client_header_buffer_size 8k;
    large_client_header_buffers 4 16k;
    client_body_buffer_size 128k;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    # ============================================
    # 安全响应头（server 级）
    # ============================================
    include security-headers.conf;

    # ============================================
    # 连接限制（zone 在 http 层定义）：单 IP 最多 100 并发
    # ============================================
    limit_conn conn_limit 100;

    # ============================================
    # 屏蔽敏感文件与目录（防信息泄露）
    # ============================================
    # 常见敏感文件扩展名直接拒绝
    location ~* \.(env|sql|git|log|bak|old|swp|sh|py|md|ini|config|conf~)$ {
        deny all;
        return 403;
    }
    # 隐藏目录 / 项目文件
    location ~ ^/(\.|node_modules|composer\.json|package\.json|\.gitignore|README) {
        deny all;
        return 403;
    }
    # 精确屏蔽 .env / .git / 数据导出文件
    location = /.env          { return 403; }
    location = /.git          { return 403; }
    location = /qyglfb.sql    { return 403; }
    location = /db-update     { return 403; }

    # ---- HTTP 方法限制：仅允许业务所需方法，拒绝 TRACE 等危险方法 ----
    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) {
        return 405;
    }

    # ============================================
    # 前端静态文件（Vite 构建产物）
    # ============================================
    root  ../dist;          # 相对 nginx 安装目录(nginx.exe 所在目录)，开发机与部署机通用
    index index.html;

    # 带 hash 的 assets 文件：长期缓存（文件内容变化时文件名变化）
    location /assets/ {
        include security-headers.conf;
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
        # 禁止通过代理方式访问本目录（仅本地静态服务）
        try_files $uri =404;
    }

    # ---- 移动端入口：扫码/链接统一跳转至移动端专用端口(9090, HTTPS) ----
    location = /m {
        return 302 http://$host:9090/;
    }

    # ---- SPA 路由 fallback：所有未匹配路径返回 index.html ----
    location / {
        include security-headers.conf;
        try_files $uri $uri/ /index.html;
        # index.html 不缓存，确保前端发版后立即生效
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # 针对首页的缓存策略
    location = /index.html {
        include security-headers.conf;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires -1;
    }

    # ============================================
    # 后端 API 反向代理
    # ============================================
    location /api/ {
        # 注意：已移除通用 API 限流(limit_req api_limit)，避免内网 OA 前端并发请求被 429 拦截
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;            # 开启缓冲，降低上游压力
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # 登录接口：更严格的限流（每 IP 每 10 秒最多 5 次，防暴力破解）
    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;

        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # ============================================
    # 上传文件（反向代理到后端 /uploads）
    # ============================================
    location /uploads/ {
        include security-headers.conf;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 上传文件缓存 1 天
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        # 禁止目录列表
        autoindex off;
    }

    # ============================================
    # Socket.IO（WebSocket 长连接）
    # ============================================
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 长连接超时 1 小时
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;           # WebSocket 需关闭缓冲
    }

    # ============================================
    # 自定义错误页（后端宕机提示）
    # ============================================
    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root   html;
        internal;
    }
}

# =====================================================
# 移动端专用站点（端口 9090，反向代理到 dev:mobile 开发服 3004）
# 移动端单一来源 = vite dev server(3004)；9090 仅做端口/协议入口，避免双份构建产物。
# /api、/uploads、/socket.io 直接反代到后端 3005；其余请求反代到 3004（移动端 SPA）。
# 访问：http://服务器IP:9090  （或经 PC 端 8080 的 /m 跳转）
# 说明：当前为明文 HTTP，便于内网/Android 调试；iOS/微信强制 HTTPS 时需改用自签证书
#       （listen 9090 ssl + ssl_certificate），并在 8080 的 /m 跳转改回 https://。
# =====================================================
server {
    listen       9090;
    server_name  _;

    charset utf-8;

    # ---- TLS：当前明文 HTTP；启用 HTTPS 时取消注释并放置自签证书 ----
    # ssl_certificate      ssl/qygl-mobile.crt;
    # ssl_certificate_key  ssl/qygl-mobile.key;
    # ssl_protocols TLSv1.2 TLSv1.3;
    # ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    # ssl_prefer_server_ciphers off;
    # ssl_session_cache shared:SSL:10m;
    # ssl_session_timeout 1d;

    # IP 访问白名单（与 PC 端一致）
    allow 127.0.0.1;
    allow 192.168.0.0/16;   # 覆盖 192.168.x.x 全段，避免 DHCP 自动 IP 变化后无法访问
    allow 192.168.1.0/24;
    allow 192.168.2.0/24;
    deny all;

    access_log  logs/qygl-mobile-access.log json;
    error_log   logs/qygl-mobile-error.log;

    client_max_body_size 20m;
    client_header_buffer_size 8k;
    large_client_header_buffers 4 16k;
    client_body_buffer_size 128k;
    client_body_timeout 30s;
    client_header_timeout 30s;
    send_timeout 60s;

    include security-headers.conf;
    limit_conn conn_limit 100;

    # 屏蔽敏感文件
    location ~* \.(env|sql|git|log|bak|old|swp|sh|py|md|ini|config|conf~)$ { deny all; return 403; }
    location ~ ^/(\.|node_modules|composer\.json|package\.json|\.gitignore|README) { deny all; return 403; }

    if ($request_method !~ ^(GET|HEAD|POST|PUT|DELETE|OPTIONS)$) { return 405; }

    # ---- 移动端 SPA：反代到 dev:mobile 开发服(3004)，单一来源 ----
    location / {
        include security-headers.conf;
        proxy_pass http://127.0.0.1:3004;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    # ---- 后端 API ----
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;
        proxy_buffering on;
        proxy_buffer_size 4k;
        proxy_buffers 8 16k;
    }

    location = /api/auth/login {
        limit_req zone=login_limit burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    location /uploads/ {
        include security-headers.conf;
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 1d;
        add_header Cache-Control "public, max-age=86400";
        autoindex off;
    }

    # ---- Socket.IO（WebSocket 长连接，与 PC 端一致）----
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }

    error_page 502 503 504 /50x.html;
    location = /50x.html {
        root   html;
        internal;
    }
}
