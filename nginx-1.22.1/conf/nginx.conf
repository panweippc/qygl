
# =====================================================
# 智慧办公平台 (OA) Nginx 主配置
# 说明：
#   - 前端静态文件：E:/AI/qy/dist（Vite 构建产物）
#   - 后端 API 反向代理：http://127.0.0.1:3005
#   - 站点配置由 qygl.conf 提供（include 引入），监听 8080
#   - 80 端口被系统 Apache httpd 占用，故使用 8080
# 访问方式：http://服务器IP:8080
# =====================================================

# 按 CPU 核数设置 worker 进程数（本机 4 核）
worker_processes  4;
worker_rlimit_nofile 65535;   # 每个 worker 可打开的文件描述符上限（静态文件/连接多时需要）

#error_log  logs/error.log;
#error_log  logs/error.log  notice;
#error_log  logs/error.log  info;

#pid        logs/nginx.pid;

events {
    # Windows 下 Nginx 使用 select；此处保留默认，提高连接数上限
    worker_connections  5024;
    multi_accept on;           # 一个 worker 同时接受多个新连接
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    # 隐藏 Nginx 版本号
    server_tokens off;

    sendfile        on;
    tcp_nopush      on;        # 优化大文件/多包发送，减少网络包数量
    tcp_nodelay     on;        # 禁用 Nagle 算法，降低小请求延迟（WebSocket/小响应有利）

    # 长连接配置：允许每个连接处理更多请求
    keepalive_timeout  65;
    keepalive_requests 500;

    # 文件描述符缓存：提升静态文件读取性能
    open_file_cache max=1000 inactive=20s;
    open_file_cache_valid 30s;
    open_file_cache_min_uses 2;
    open_file_cache_errors on;

    # ============================================
    # 限流 / 连接限制定义（在 http 层定义，供各 server/location 引用）
    # ============================================
    # 登录接口限流：每 IP 每 10 秒最多 5 次，超出返回 429（配合后端限流双层防护）
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    # 通用 API 限流：每 IP 每 5 秒最多 30 次（防止刷接口）
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=30r/m;
    # 通用 API 连接数限制：每 IP 最多 100 个并发连接
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # 日志格式：加入请求耗时与后端耗时，便于性能排查
    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for" '
                      'req=${request_time}ms up=${upstream_response_time}ms';
    log_format  json  '{"time":"$time_local","remote":"$remote_addr","req":"$request",'
                      '"status":$status,"bytes":$body_bytes_sent,"ua":"$http_user_agent",'
                      '"req_ms":$request_time,"up_ms":$upstream_response_time}';

    # ---- gzip 压缩 ----
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;
    gzip_vary on;
    gzip_proxied any;
    gzip_disable "msie6";

    # 引入 OA 平台站点配置（托管前端 + 反代后端 API/Socket.IO）
    # 注意：必须放在 log_format 定义之后，否则站点内引用 json 日志格式会报错
    include       qygl.conf;
}
