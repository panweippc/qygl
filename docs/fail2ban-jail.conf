# =====================================================
# OA系统 Fail2ban 防护配置
# 用途：自动封禁恶意IP，保护应用层和系统层安全
# 部署环境：Linux服务器
# =====================================================

# ==================== SSH 登录防护 ====================
[sshd]
enabled = true
port = 22022                     # 修改后的SSH端口（与sshd_config一致）
filter = sshd
logpath = /var/log/auth.log
maxretry = 5                     # 5次失败后封禁
bantime = 3600                   # 封禁1小时
findtime = 600                   # 10分钟内失败5次
ignoreip = 127.0.0.1 192.168.0.0/16  # 内网IP白名单

# ==================== Nginx 登录爆破防护 ====================
[nginx-login-ban]
enabled = true
port = http,https
filter = nginx-login
logpath = /var/log/nginx/qygl-access.log    # 根据实际日志路径调整
maxretry = 10                    # 10次失败登录尝试
bantime = 7200                   # 封禁2小时
findtime = 600                   # 10分钟内
ignoreip = 127.0.0.1 192.168.0.0/16

# ==================== Nginx 恶意扫描防护 ====================
[nginx-scan-ban]
enabled = true
port = http,https
filter = nginx-scan
logpath = /var/log/nginx/qygl-access.log
maxretry = 20                    # 20次404/403错误
bantime = 86400                  # 封禁24小时
findtime = 3600                  # 1小时内
ignoreip = 127.0.0.1 192.168.0.0/16

# ==================== Nginx API 滥用防护 ====================
[nginx-api-abuse]
enabled = true
port = http,https
filter = nginx-api-abuse
logpath = /var/log/nginx/qygl-access.log
maxretry = 100                   # 100次429限流错误
bantime = 3600                   # 封禁1小时
findtime = 300                   # 5分钟内
ignoreip = 127.0.0.1 192.168.0.0/16

# ==================== 应用层暴力破解防护 ====================
[oa-login-bruteforce]
enabled = true
port = http,https
filter = oa-login
logpath = /path/to/qy/logs/security-alert.log    # 应用安全告警日志
maxretry = 5
bantime = 7200                   # 封禁2小时
findtime = 600
ignoreip = 127.0.0.1 192.168.0.0/16
action = %(action_)s
         %(action_mwl)s         # 发送邮件通知（需配置mail-whois）