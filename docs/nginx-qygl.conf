# =====================================================
# 智慧办公平台 Nginx 站点配置
# 用途：托管前端静态文件 + 反向代理后端 API
# 部署位置：D:\nginx\nginx-1.22.1\conf\qygl.conf
# 由主 nginx.conf 通过 include 引入
# =====================================================

server {
    listen       80;
    server_name  _;   # 监听所有主机名（内网IP直接访问）

    # ---- 字符集与响应头 ----
    charset utf-8;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "no-referrer" always;
    # 隐藏 Nginx 版本号
    server_tokens off;

    # ---- 日志 ----
    access_log  logs/qygl-access.log;
    error_log   logs/qygl-error.log;

    # 请求体大小限制（与后端一致，10MB）
    client_max_body_size 20m;

    # ---- 前端静态文件（Vite 构建产物）----
    # 指向项目 dist 目录，请根据实际路径修改
    root  E:/AI/qy/dist;
    index index.html;

    # gzip 压缩
    gzip on;
    gzip_min_length 1k;
    gzip_comp_level 5;
    gzip_types text/plain text/css application/json application/javascript text/javascript image/svg+xml application/xml;
    gzip_vary on;

    # ---- 静态资源缓存（带 hash 的 assets 文件）----
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ---- 后端 API 反向代理 ----
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }

    # ---- 上传文件 ----
    location /uploads/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 上传文件缓存 1 天
        expires 1d;
    }

    # ---- Socket.IO（WebSocket 长连接）----
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;   # 长连接超时 1 小时
        proxy_send_timeout 3600s;
    }

    # ---- SPA 路由 fallback ----
    # Vue Router 使用 history 模式，所有未匹配路径都返回 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
