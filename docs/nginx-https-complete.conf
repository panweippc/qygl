# =====================================================
# OA系统 HTTPS 完整配置模板
# 支持 Let's Encrypt 自动续期 + HTTP/2
# =====================================================

# HTTP -> HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name your-domain.com www.your-domain.com;  # 替换为实际域名

    # 允许 Let's Encrypt ACME 验证
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;              # 启用 HTTP/2
    listen [::]:443 ssl http2;
    server_name your-domain.com www.your-domain.com;  # 替换为实际域名

    # ==================== SSL 证书配置 ====================
    # Let's Encrypt 证书路径
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;

    # SSL 协议与加密套件（仅允许安全协议）
    ssl_protocols TLSv1.2 TLSv1.3;     # 禁用不安全的 TLSv1.0/1.1
    ssl_ciphers 'ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384';
    ssl_prefer_server_ciphers off;     # 优先使用服务器密码套件

    # SSL 会话缓存（提升性能）
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;           # 禁用会话票证（前向保密）

    # ==================== OCSP Stapling ====================
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/your-domain.com/chain.pem;
    resolver 8.8.8.8 8.8.4.4 valid=300s;
    resolver_timeout 5s;

    # ==================== HSTS（强制HTTPS）====================
    # 严格传输安全，防止降级攻击
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;

    # ==================== 引入安全响应头 ====================
    include security-headers.conf;

    # ==================== 字符集与日志 ====================
    charset utf-8;
    access_log /var/log/nginx/qygl-https-access.log;
    error_log /var/log/nginx/qygl-https-error.log;

    # ==================== 请求体限制 ====================
    client_max_body_size 20m;

    # ==================== 前端静态文件 ====================
    root /path/to/qy/dist;             # 替换为实际路径
    index index.html;

    # ==================== 静态资源缓存 ====================
    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, max-age=604800, immutable";
    }

    # ==================== 后端 API 反向代理 ====================
    location /api/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;  # 告知后端使用HTTPS
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;

        # WebSocket 支持（如果需要）
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # ==================== 上传文件 ====================
    location /uploads/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        expires 1d;
    }

    # ==================== Socket.IO（WebSocket）====================
    location /socket.io/ {
        proxy_pass http://127.0.0.1:3005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # ==================== SPA 路由 fallback ====================
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# ==================== 性能优化 ====================
# 在 http {} 块中添加以下配置：

# SSL 会话缓存共享内存
ssl_session_cache shared:SSL:50m;

# 启用 SSL 会话缓存
ssl_session_timeout 1d;

# 禁用 SSL 会话票证
ssl_session_tickets off;

# OCSP Stapling 缓存
ssl_stapling_cache shared:OCSP:10m;