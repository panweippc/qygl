# =====================================================
# Fail2ban 过滤规则配置
# 对应上面的 jail.local 配置
# =====================================================

# ==================== SSH 登录过滤规则 ====================
# 使用系统自带的 sshd.conf，无需额外配置

# ==================== Nginx 登录失败过滤规则 ====================
[Definition]
failregex = ^<HOST> .* "(GET|POST) /api/auth/login.*" (401|429) .*$
ignoreregex =

# ==================== Nginx 恶意扫描过滤规则 ====================
[Definition]
# 匹配404/403错误，排除静态资源
failregex = ^<HOST> .* "(GET|POST|HEAD) .*" (404|403) .*$
ignoreregex = ^<HOST> .* "(GET|POST) /(assets/|uploads/|static/|.*\.(css|js|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)).*" (404|403) .*$

# ==================== Nginx API 滥用过滤规则 ====================
[Definition]
failregex = ^<HOST> .* "(GET|POST|PUT|DELETE) /api/.*" 429 .*$
ignoreregex =

# ==================== OA应用登录爆破过滤规则 ====================
[Definition]
# 从应用安全告警日志中提取IP和暴力破解事件
failregex = .*"ip":"<HOST>".*"type":"login_brute_force".*
ignoreregex =